name: CI

on:
  push:
    branches: [main, phase-7-release]
  pull_request:
    branches: [main, phase-7-release]

jobs:
  validate:
    name: Validate, build & browser tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Read pinned Node version
        id: node-version
        shell: bash
        run: echo "version=$(cat .nvmrc)" >> "$GITHUB_OUTPUT"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ steps.node-version.outputs.version }}
          cache: npm

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Validate JSON
        run: npm run validate-json

      - name: Check design tokens
        run: npm run check:tokens

      - name: Check derived image manifest
        run: npm run check:derived

      - name: Type check
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Run unit tests
        run: npm test

      - name: Build
        run: npm run build

      # Log mode writes the exact email/WhatsApp payload to .tmp/order-previews
      # and contacts nobody; the channel keys are blanked so a stray runtime
      # path could not send anything even if the mode were ignored.
      - name: First-load JS budget
        env:
          ORDER_CHANNELS_MODE: log
          RESEND_API_KEY: ""
          OWNER_EMAIL: ""
          RESEND_FROM_EMAIL: ""
          OPENAI_API_KEY: ""
        run: |
          npx next start --hostname 127.0.0.1 --port 3227 &
          SERVER_PID=$!
          for i in $(seq 1 60); do curl -sf -o /dev/null http://127.0.0.1:3227/ && break; sleep 2; done
          npm run perf:budget
          STATUS=$?
          kill "$SERVER_PID" 2>/dev/null || true
          exit $STATUS

      - name: Run Playwright against production build
        run: npm run e2e -- --project=chromium-desktop --project=chromium-mobile
        env:
          CI: true
          ORDER_CHANNELS_MODE: log
          RESEND_API_KEY: ""
          OWNER_EMAIL: ""
          RESEND_FROM_EMAIL: ""
          OPENAI_API_KEY: ""

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            playwright-results/
          retention-days: 14
